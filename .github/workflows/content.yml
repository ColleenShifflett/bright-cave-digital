name: content

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Validate content frontmatter
        run: python3 tools/validate_content.py src/content

      # Staged work is checked but not gating. A draft is allowed to be
      # incomplete; that is what drafts are for. Failures here are advisory.
      - name: Validate staged drafts
        continue-on-error: true
        run: |
          if [ -d drafts ]; then
            python3 tools/validate_content.py drafts
          else
            echo "no drafts/ directory"
          fi

      - name: Check inventory counts are current
        run: |
          python3 tools/validate_content.py --inventory --check src/content \
            --inventory-file docs/concept-inventory.md

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Catches broken reference() links: a manifest pointing at an atom that
      # does not exist, or a prerequisite naming a missing id. The Python
      # validator does not check reference integrity; this does.
      - run: npm run build
